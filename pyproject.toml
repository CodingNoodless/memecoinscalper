[project]
name = "tradeslavebot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
    "websockets>=13.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "solders>=0.29.0",
    "openai>=3.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
